<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="14%" r="100%">
      <stop offset="0%"   stop-color="#5c2a86"/>
      <stop offset="45%"  stop-color="#2a1345"/>
      <stop offset="100%" stop-color="#120a20"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f78ac8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f78ac8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blossom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffb3dd"/>
      <stop offset="55%"  stop-color="#f78ac8"/>
      <stop offset="100%" stop-color="#c46fe0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- nebula bloom -->
  <ellipse cx="330" cy="150" rx="190" ry="150" fill="url(#glow)"/>
  <ellipse cx="150" cy="360" rx="160" ry="130" fill="#b26eeb" opacity=".16"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="96"  cy="112" r="3"   opacity=".75"/>
    <circle cx="404" cy="96"  r="2.5" opacity=".6"/>
    <circle cx="146" cy="392" r="2.5" opacity=".55"/>
    <circle cx="428" cy="356" r="3"   opacity=".5"/>
    <circle cx="318" cy="432" r="2"   opacity=".55"/>
    <circle cx="72"  cy="248" r="2"   opacity=".45"/>
    <circle cx="452" cy="216" r="2"   opacity=".45"/>
    <circle cx="212" cy="84"  r="2"   opacity=".4"/>
  </g>
  <g fill="#ffd6f0">
    <circle cx="378" cy="286" r="2.5" opacity=".7"/>
    <circle cx="112" cy="182" r="2"   opacity=".6"/>
  </g>

  <!-- four-point star: the wayfinding mark -->
  <path fill="url(#blossom)" d="M256 150
    C264 214 298 248 362 256
    C298 264 264 298 256 362
    C248 298 214 264 150 256
    C214 248 248 214 256 150 Z"/>

  <!-- small companion star -->
  <path fill="#ffd6f0" opacity=".9" d="M372 356
    C375 378 386 389 408 392
    C386 395 375 406 372 428
    C369 406 358 395 336 392
    C358 389 369 378 372 356 Z"/>
</svg>
